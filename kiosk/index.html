<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=480, height=272, initial-scale=1, user-scalable=no" />
<title>MyBrickPass — Validator</title>
<style>
  :root {
    --cm-blue: #1D4E89;
    --cm-blue-dark: #123457;
    --cm-green: #1E8E5A;
    --cm-red: #C0392B;
    --cm-ink: #12181F;
    --cm-paper: #FFFFFF;
    --cm-line: #D8DEE6;
  }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

  html, body {
    margin: 0; padding: 0;
    width: 480px; height: 272px;
    overflow: hidden;
    background: var(--cm-paper);
    font-family: Helvetica, Arial, sans-serif;
    color: var(--cm-ink);
  }

  #screen {
    position: relative;
    width: 480px; height: 272px;
  }

  .state {
    position: absolute; inset: 0;
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
  }
  .state.active { display: flex; }

  /* ---------- corner logo — shown over every screen ---------- */
  .corner-logo {
    position: absolute; top: 10px; left: 12px; z-index: 5;
    display: flex; align-items: center; gap: 6px;
  }
  .corner-logo img { width: 22px; height: 22px; border-radius: 5px; background: white; padding: 1px; }
  .corner-logo span { font-size: 11px; font-weight: 700; letter-spacing: 0.4px; color: white; text-shadow: 0 1px 2px rgba(0,0,0,0.25); }
  #state-processing .corner-logo span { color: var(--cm-ink); text-shadow: none; }

  /* ---------- idle — styled like a real transit "TAP" validator ---------- */
  #state-idle { padding: 0; }
  #state-idle .idle-top {
    flex: 0 0 42%;
    width: 100%;
    background: #E7F1FB;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
  }
  #state-idle .idle-top .arrow-badge {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--cm-blue); color: white;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 6px;
  }
  #state-idle .idle-top .prompt {
    font-size: 15px; font-weight: 700; color: var(--cm-blue-dark);
  }
  #state-idle .idle-bottom {
    flex: 1;
    width: 100%;
    background: var(--cm-blue);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    gap: 6px;
  }
  #state-idle .tap-wordmark {
    font-size: 34px; font-weight: 800; letter-spacing: 3px; color: white;
  }
  #state-idle .tap-icon { width: 58px; height: 58px; }

  /* ---------- out of service ---------- */
  #state-out-of-service {
    background: #3A4048;
    color: #C7CDD4;
  }
  #state-out-of-service .mark {
    font-size: 18px;
    font-weight: 700;
    color: #E8EAED;
  }
  #state-out-of-service .prompt {
    font-size: 13px;
    margin-top: 8px;
  }

  /* ---------- processing ---------- */
  #state-processing { background: var(--cm-paper); }
  .spinner {
    width: 34px; height: 34px;
    border: 4px solid var(--cm-line);
    border-top-color: var(--cm-blue);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin-bottom: 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  #state-processing .label { font-size: 15px; color: #566473; }

  /* ---------- result — big full-screen "Go" / "Stop" look, like a real validator ---------- */
  #state-approved { background: var(--cm-green); }
  #state-denied { background: var(--cm-red); }

  .state.result .badge {
    width: 84px; height: 84px;
    border-radius: 50%;
    background: rgba(255,255,255,0.18);
    border: 3px solid white;
    display: flex; align-items: center; justify-content: center;
    margin-bottom: 12px;
  }
  .state.result .badge svg { width: 46px; height: 46px; }

  .state.result .headline {
    font-size: 40px;
    font-weight: 800;
    letter-spacing: 1px;
    color: white;
  }

  .state.result .detail {
    font-size: 15px;
    font-weight: 600;
    color: rgba(255,255,255,0.92);
    margin-top: 8px;
  }
  .state.result .balance {
    margin-top: 12px;
    font-size: 13px;
    color: white;
    background: rgba(255,255,255,0.2);
    border-radius: 6px;
    padding: 5px 12px;
  }

  /* ---------- dev/test panel (hidden on the real device) ---------- */
  #devpanel {
    position: absolute; inset: 0;
    background: rgba(0,0,0,0.82);
    display: none;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 8px;
    z-index: 10;
  }
  #devpanel.active { display: flex; }
  #devpanel input {
    width: 220px; padding: 6px 8px; font-size: 13px;
    border-radius: 4px; border: none;
  }
  #devpanel button {
    width: 220px; padding: 7px 8px; font-size: 13px;
    border-radius: 4px; border: none; cursor: pointer;
    background: var(--cm-blue); color: white;
  }
  #devpanel .hint { color: #aaa; font-size: 11px; margin-top: 6px; }
</style>
</head>
<body>

<div id="screen">

  <div id="state-idle" class="state active">
    <div class="corner-logo"><img src="https://alerts.citymetro.xyz/logo.png" alt="" /><span style="color:var(--cm-blue-dark)">CITY METRO</span></div>
    <div class="idle-top">
      <div class="arrow-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5"><path d="M12 4v14M6 13l6 6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="prompt">Tap Below or Scan Ticket</div>
    </div>
    <div class="idle-bottom">
      <svg class="tap-icon" viewBox="0 0 64 64" fill="none">
        <circle cx="32" cy="32" r="30" stroke="white" stroke-width="2" opacity="0.6"/>
        <path d="M20 40 L34 26 L42 34 L28 48 Z" fill="none" stroke="white" stroke-width="2.5" stroke-linejoin="round"/>
        <path d="M40 22c2 2 3 4 3 7s-1 5-3 7" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.85"/>
        <path d="M45 18c3 3 5 7 5 11s-2 8-5 11" stroke="white" stroke-width="2" stroke-linecap="round" opacity="0.5"/>
      </svg>
      <div class="tap-wordmark">TAP</div>
    </div>
  </div>

  <div id="state-out-of-service" class="state">
    <div class="corner-logo"><img src="https://alerts.citymetro.xyz/logo.png" alt="" /><span>CITY METRO</span></div>
    <div class="mark">Out of Service</div>
    <div class="prompt">This validator is temporarily unavailable.<br>Please board and tap at the next validator.</div>
  </div>

  <div id="state-processing" class="state">
    <div class="corner-logo"><img src="https://alerts.citymetro.xyz/logo.png" alt="" /><span>CITY METRO</span></div>
    <div class="spinner"></div>
    <div class="label">Checking fare…</div>
  </div>

  <div id="state-approved" class="state result">
    <div class="corner-logo"><img src="https://alerts.citymetro.xyz/logo.png" alt="" /><span>CITY METRO</span></div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
        <path d="M4 12l5 5L20 6" stroke-linecap="round" stroke-linejoin="round"/>
      </svg>
    </div>
    <div class="headline">GO</div>
    <div class="detail" id="approved-detail">Fare deducted</div>
    <div class="balance" id="approved-balance"></div>
  </div>

  <div id="state-denied" class="state result">
    <div class="corner-logo"><img src="https://alerts.citymetro.xyz/logo.png" alt="" /><span>CITY METRO</span></div>
    <div class="badge">
      <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="3">
        <path d="M6 6l12 12M18 6L6 18" stroke-linecap="round"/>
      </svg>
    </div>
    <div class="headline">STOP</div>
    <div class="detail" id="denied-detail">Insufficient balance</div>
  </div>

  <!-- Dev/test overlay: press "d" on a keyboard to show. Not part of the
       production kiosk build — lets you exercise the flow without real
       reader hardware attached. Remove before shipping to the device. -->
  <div id="devpanel">
    <input id="dev-card" placeholder="NFC tag value (BP… or UID hex)" />
    <button onclick="devTap()">Simulate NFC Tap</button>
    <input id="dev-code" placeholder="Barcode/QR value (card or ticket)" />
    <button onclick="devScan()">Simulate Barcode Scan</button>
    <div class="hint">Ctrl+Shift+D to hide</div>
  </div>

</div>

<script>
  // ---- configuration ----
  const API_BASE = "https://brickpassv3.felixfeger46.workers.dev";
  // Admin portal -> Devices -> "Register a Device" (kind: Validator) gives you both of these.
  const VALIDATOR_ID = "VAL100-01";                       // must equal the Device ID you registered
  const DEVICE_KEY = "dk_PASTE_THE_KEY_FROM_THE_ADMIN_PORTAL";
  // What THIS unit's readers really are. Reported to the API on boot; the API
  // then only accepts scans of these kinds from this device.
  const DEVICE_MODEL = "Access IS VAL100";
  const FIRMWARE_VERSION = "kiosk-page-1";
  const MODULES = ["nfc", "barcode_2d"];                  // VAL100: NFC/RFID + 2D barcode (reads QR)
  const WEDGE_ENABLED = true;                             // also accept readers that "type" scans like a keyboard

  // ---- state machine ----
  const states = ["idle", "processing", "approved", "denied", "out-of-service"];
  let isOutOfService = false;
  let deviceProblem = null;   // set when registration fails (bad key, revoked, bad module list)
  let registered = false;

  function showState(name) {
    for (const s of states) {
      document.getElementById(`state-${s}`).classList.toggle("active", s === name);
    }
  }

  // Poll our own status periodically. If an admin flips this validator to
  // out_of_service, the idle screen switches over within one poll interval —
  // no reboot or redeploy of the kiosk needed.
  async function pollValidatorStatus() {
    if (!registered) await registerDevice();
    try {
      const res = await fetch(`${API_BASE}/validators/${VALIDATOR_ID}/status`);
      const data = await res.json();
      isOutOfService = data.status === "out_of_service";
    } catch (e) {
      // Network hiccup — keep the last known status rather than flipping states.
    }
    // Only touch the screen if we're currently idle/out-of-service (don't
    // interrupt an in-progress tap/scan result).
    const current = states.find(s => document.getElementById(`state-${s}`).classList.contains("active"));
    if (current === "idle" || current === "out-of-service") {
      const unavailable = isOutOfService || deviceProblem;
      document.querySelector("#state-out-of-service .prompt").innerHTML = deviceProblem
        ? `Reader setup problem:<br>${deviceProblem}`
        : "This validator is temporarily unavailable.<br>Please board and tap at the next validator.";
      showState(unavailable ? "out-of-service" : "idle");
    }
  }

  // ---- API helper: every call carries this device's key ----
  async function api(path, body) {
    const res = await fetch(`${API_BASE}${path}`, {
      method: "POST",
      headers: { "content-type": "application/json", "x-device-key": DEVICE_KEY },
      body: JSON.stringify(body),
    });
    let data = {};
    try { data = await res.json(); } catch (e) {}
    return { status: res.status, data };
  }

  // Tell the API which reader modules this unit has. Until this succeeds the
  // API rejects scans from this device (module_not_registered).
  async function registerDevice() {
    try {
      const { status, data } = await api("/device/register", { model: DEVICE_MODEL, firmware: FIRMWARE_VERSION, modules: MODULES });
      if (status === 200) { registered = true; deviceProblem = null; return; }
      deviceProblem = status === 401
        ? "device key rejected (check DEVICE_KEY, or the device was revoked)"
        : (data.error || `registration failed (${status})`);
    } catch (e) {
      // Offline — leave deviceProblem alone and retry on the next poll.
    }
  }

  pollValidatorStatus();
  setInterval(pollValidatorStatus, 30000);

  // ---- sound effects (generated tones, no audio files needed) ----
  function playTone(freq, durationSec, type = "sine", startTime = 0, volume = 0.25) {
    try {
      const ctx = playTone._ctx || (playTone._ctx = new (window.AudioContext || window.webkitAudioContext)());
      const osc = ctx.createOscillator();
      const gain = ctx.createGain();
      osc.type = type;
      osc.frequency.value = freq;
      osc.connect(gain);
      gain.connect(ctx.destination);
      const t0 = ctx.currentTime + startTime;
      gain.gain.setValueAtTime(volume, t0);
      gain.gain.exponentialRampToValueAtTime(0.001, t0 + durationSec);
      osc.start(t0);
      osc.stop(t0 + durationSec);
    } catch (e) { /* AudioContext can fail before a user gesture on some browsers — silently skip */ }
  }
  function playApprovedSound() {
    // Two-tone ascending chime, like most real transit validators.
    playTone(880, 0.14, "sine", 0);
    playTone(1318, 0.18, "sine", 0.12);
  }
  function playDeniedSound() {
    // Low buzz, distinct and unmistakable from the approved chime.
    playTone(180, 0.35, "square", 0, 0.15);
  }

  let resultTimer = null;
  function showResult(name, { detailText, balanceText } = {}) {
    clearTimeout(resultTimer);
    showState(name);
    if (name === "approved") { playApprovedSound(); } else if (name === "denied") { playDeniedSound(); }
    if (name === "approved") {
      document.getElementById("approved-detail").textContent = detailText || "Fare deducted";
      document.getElementById("approved-balance").textContent = balanceText || "";
      document.getElementById("approved-balance").style.display = balanceText ? "block" : "none";
    } else if (name === "denied") {
      document.getElementById("denied-detail").textContent = detailText || "Please try again";
    }
    resultTimer = setTimeout(() => showState("idle"), 3000);
  }

  const REASON_TEXT = {
    active_pass: (r) => `${r.fare_type === "week" ? "Weekly" : "Day"} pass — no charge`,
    fare_deducted: (r) => "One-way fare deducted",
    transfer: () => "Free transfer — within 2 hours of last fare",
    free_day: () => "Free fare day — no charge",
    insufficient_balance: () => "Insufficient balance",
    unknown_card: () => "Card not recognized",
    blocked: () => "Card is blocked",
    lost: () => "Card reported lost",
    ticket_accepted: (r) => r.rides_remaining > 0 ? "Ticket accepted — 1 ride remaining" : "Ticket accepted",
    used: () => "Ticket already used",
    expired: () => "Ticket expired",
    unknown_ticket: () => "Ticket not recognized",
    validator_out_of_service: () => "This validator is out of service",
    module_not_registered: () => "Reader not registered — see staff",
  };

  function describe(res) {
    if (res.data.error) return res.status === 401 ? "Device key rejected — see staff" : res.data.error;
    return (REASON_TEXT[res.data.reason] || (() => res.data.reason || "Try again"))(res.data);
  }

  // ---- reader entry points ----
  // Whatever glue connects the VAL100's readers to this page calls ONE of these:
  //   onCardTapped(value)     NFC/RFID read  — value is a BP number OR the tag's UID (hex)
  //   onBarcodeScanned(value) barcode/QR scan — a BP number (card) or a ticket code
  //   onTicketScanned(code)   explicitly a ticket
  // Anything that "types" scans like a keyboard is handled by the wedge listener below.

  async function handleCard(module, value) {
    if (isOutOfService) { showState("out-of-service"); return; }
    if (!registered) await registerDevice();
    showState("processing");
    try {
      const res = await api("/validate", { module, value });
      const text = describe(res);
      if (res.data.approved) {
        const balanceText = "new_balance_cents" in res.data
          ? `Balance: $${(res.data.new_balance_cents / 100).toFixed(2)}`
          : "";
        showResult("approved", { detailText: text, balanceText });
      } else {
        showResult("denied", { detailText: text });
      }
    } catch (e) {
      showResult("denied", { detailText: "Network error — try again" });
    }
  }

  async function handleTicket(code) {
    if (isOutOfService) { showState("out-of-service"); return; }
    if (!registered) await registerDevice();
    showState("processing");
    try {
      const res = await api("/validate-ticket", { module: "barcode", code });
      showResult(res.data.approved ? "approved" : "denied", { detailText: describe(res) });
    } catch (e) {
      showResult("denied", { detailText: "Network error — try again" });
    }
  }

  window.onCardTapped = (value) => handleCard("nfc", String(value).trim());
  window.onTicketScanned = (code) => handleTicket(String(code).trim());
  window.onBarcodeScanned = (value) => {
    value = String(value).trim();
    // A BP number is a card; anything else scanned from a barcode/QR is a ticket code.
    if (/^BP\d{10}$/i.test(value)) handleCard("barcode", value.toUpperCase());
    else handleTicket(value);
  };

  // ---- keyboard-wedge input ----
  // Some readers present themselves as a keyboard: they "type" the scan and press
  // Enter. Characters arriving faster than a human can type are collected and
  // routed here. NFC reads are recognised by an "NFC:" or "MF" prefix, or by
  // looking like a tag UID (8/14/20 hex characters); everything else is a barcode.
  let wedgeBuf = "", wedgeLast = 0;
  window.addEventListener("keydown", (e) => {
    if (!WEDGE_ENABLED || e.target.tagName === "INPUT") return;
    const now = Date.now();
    if (e.key === "Enter") {
      const value = wedgeBuf.trim(); wedgeBuf = "";
      if (value.length < 4) return;
      if (/^(NFC:|MF)/i.test(value)) window.onCardTapped(value.replace(/^NFC:/i, ""));
      else if (/^([0-9A-F]{8}|[0-9A-F]{14}|[0-9A-F]{20})$/i.test(value)) window.onCardTapped(value);
      else window.onBarcodeScanned(value);
    } else if (e.key.length === 1) {
      if (now - wedgeLast > 100) wedgeBuf = "";   // a pause means a human, not a reader
      wedgeBuf += e.key; wedgeLast = now;
    }
  });

  // ---- dev/test helpers ----
  function devTap() { window.onCardTapped(document.getElementById("dev-card").value.trim()); }
  function devScan() { window.onBarcodeScanned(document.getElementById("dev-code").value.trim()); }
  window.addEventListener("keydown", (e) => {
    if (e.ctrlKey && e.shiftKey && e.key.toLowerCase() === "d") document.getElementById("devpanel").classList.toggle("active");
  });
</script>

</body>
</html>
